<title>手绘精灵对战</title>

<style>
/* Layout: 一页摊开的方格本。上方是背包/血条卡（贴着胶带），中间是方格纸战场，下方是指令区和红蓝笔写的战斗记录 */
:root {

  --blue: #2a4ca0;
  --tape: rgba(232, 208, 128, 0.72);
  --hp-ok: #55b25a;
  --hp-mid: #e3b22c;
  --hp-low: #d8473a;
  --shade: rgba(35, 34, 43, 0.08);
  --f-hand: "Long Cang", "Kaiti SC", "STKaiti", "KaiTi", cursive;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: light;
}
html, body { background: var(--desk); color: var(--ink); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.sheet {
  overflow-x: clip;
  max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height: 100%;
  box-shadow: 0 0 0 1px var(--rule);
}
.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.masthead h1 { font-family: var(--f-hand); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 0; color: var(--ink); text-wrap: balance; }
.masthead h1 small { font-size: 22px; color: var(--red); margin-left: 8px; }
.masthead .sub { color: var(--pencil); font-size: 13px; }

h2.sec { font-family: var(--f-hand); font-weight: 400; font-size: 28px; margin: 0; color: var(--ink); }
.hint { color: var(--pencil); font-size: 13px; margin: 0; }
.blue { color: var(--blue); }
.red { color: var(--red); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--rule); color: var(--ink); white-space: nowrap; }
.tchip { color: #fff; border: 0; font-weight: 600; }
.chip.up { color: var(--blue); border-color: currentColor; }
.chip.down { color: var(--red); border-color: currentColor; }
.chip.st { color: #fff; background: var(--red); border-color: var(--red); }
.chip.fx { color: var(--ink); background: var(--tape); border-color: transparent; }

.btn { cursor: pointer; border: 1.5px solid var(--ink); background: var(--paper-2); border-radius: 10px; padding: 9px 16px; font-weight: 600; box-shadow: 2px 2px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.primary { background: var(--red); color: #fff; border-color: var(--ink); }
.btn.ghost { box-shadow: none; background: transparent; }

/* ============ 选精灵 ============ */
.modebar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.mode { cursor: pointer; text-align: left; display: grid; gap: 2px; padding: 10px 14px; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--paper-2); }
.mode b { font-family: var(--f-hand); font-weight: 400; font-size: 26px; line-height: 1.1; color: var(--ink); }
.mode span { font-size: 12.5px; color: var(--pencil); }
.mode.on { background: var(--ink); box-shadow: 3px 3px 0 var(--red); }
.mode.on b { color: #fff; } .mode.on span { color: #d8d4c8; }
.rankcard { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; display: grid; gap: 10px; }
.rc-main { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.rbadge { display: inline-grid; place-items: center; min-width: 64px; height: 64px; padding: 0 8px; border-radius: 50% 50% 46% 46% / 40% 40% 60% 60%; background: var(--rc); color: #fff;
  font-family: var(--f-hand); font-size: 24px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 2px 2px 0 var(--ink); border: 1.5px solid var(--ink); }
.stars { display: inline-flex; gap: 2px; font-size: 20px; color: var(--rule); }
.stars i { font-style: normal; } .stars i.on { color: #d8a31c; }
.stars.king { color: #d8a31c; font-size: 16px; font-weight: 700; white-space: nowrap; }
.rc-txt { display: grid; gap: 2px; min-width: 0; }

.rc-txt .rc-rule { color: var(--pencil); }
.rc-rec { display: grid; gap: 4px; justify-items: end; font-size: 12.5px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.rc-rec .btn { padding: 4px 10px; font-size: 12px; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.ladder li { text-align: center; font-size: 11.5px; padding: 3px 0; border-radius: 6px; border: 1px solid var(--rule); color: var(--pencil); background: var(--paper); white-space: nowrap; overflow: hidden; }
.ladder li.done { background: var(--rc); color: #fff; border-color: transparent; opacity: .55; }
.ladder li.cur { background: var(--rc); color: #fff; border-color: var(--ink); font-weight: 700; box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--rc); }
.pips span.unk { background: var(--paper); border-style: dashed; color: var(--pencil); font-size: 9px; line-height: 9px; text-align: center; font-weight: 700; }
.end-rank { display: grid; gap: 6px; justify-items: center; }
.er-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.er-row .rbadge { min-width: 48px; height: 48px; font-size: 19px; }
.er-arrow { font-size: 22px; color: var(--pencil); }
.er-msg { margin: 0; font-weight: 700; } .er-msg.up { color: var(--blue); } .er-msg.down { color: var(--red); }
@media (max-width: 700px) {
  .rc-main { grid-template-columns: auto minmax(0, 1fr); }
  .rc-main .stars { justify-self: start; }
  .rc-txt, .rc-rec { grid-column: 1 / -1; justify-items: start; }
  .ladder { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
.draft-lead { margin: 0 0 10px; font-size: 13.5px; }

.dopt-head .btn { padding: 6px 12px; font-size: 13px; }

@media (max-width: 760px) { .draft-opts { grid-template-columns: minmax(0, 1fr); } }

.sub { cursor: pointer; border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 16px; background: var(--paper-2); font-weight: 600; }
.sub.on { background: var(--ink); color: #fff; }

.pbar { display: inline-block; width: 60px; height: 7px; border-radius: 99px; background: var(--paper); border: 1px solid var(--rule); margin-right: 6px; vertical-align: middle; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--red); }
@media (max-width: 760px) { .trainset { grid-template-columns: minmax(0, 1fr); } .sb-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.slot.drag-ghost { position: fixed !important; z-index: 200; pointer-events: none; margin: 0; transform: rotate(-3deg) scale(1.04); box-shadow: 0 10px 24px rgba(0,0,0,.22); opacity: .95; }

.stats { display: grid; grid-template-columns: auto 3ch minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-variant-numeric: tabular-nums; font-size: 13px; }
.stats .bar { height: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: 99px; overflow: hidden; }

.moves-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.mlist { display: grid; gap: 4px; margin-top: 6px; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 6px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.mrow:hover { background: var(--paper); }
.mrow.on { background: var(--paper); border-color: var(--rule); }
.mrow.hid { border-left: 3px solid var(--tape); }
.mrow input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--red); }
.mrow .l1 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.mrow .mn { color: var(--red); font-weight: 600; }
.mrow .mm { color: var(--pencil); font-size: 12px; font-variant-numeric: tabular-nums; }

.d-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ============ 对战 ============ */
.plates { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; margin-bottom: 12px; }
.plate { position: relative; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px 14px 10px; display: grid; gap: 6px; min-width: 0; }
.plate .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plate .pn { font-family: var(--f-hand); font-size: 30px; line-height: 1; color: var(--red); }
.plate .who { font-size: 12px; color: var(--pencil); margin-left: auto; }
.abil { position: relative; display: inline-flex; align-items: center; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
  border: 1.5px dashed var(--red); color: var(--red); background: var(--paper-2); cursor: help; white-space: nowrap; outline: none; }
.abil:hover, .abil:focus-visible { background: var(--red); color: #fff; border-style: solid; }
.tt { position: relative; display: inline-flex; cursor: help; outline: none; border-radius: 999px; }
.tt:hover .tchip, .tt:focus-visible .tchip { box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px var(--ink); }
.tt .tip, .abil .tip { position: absolute; top: calc(100% + 10px); left: 0; z-index: 40; width: max-content; max-width: min(280px, 70vw);
  background: var(--ink); color: #fff; padding: 9px 11px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; white-space: normal;
  box-shadow: 3px 3px 0 var(--red); opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; text-align: left; }
.abil .tip::before { content: ""; position: absolute; top: -6px; left: 16px; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.abil .tip b { display: block; font-weight: 700; color: var(--tape); margin-bottom: 2px; font-size: 13px; }
.abil:hover .tip, .abil:focus .tip, .tt:hover .tip, .tt:focus .tip, .sc:hover .tip, .sc:focus .tip { opacity: 1; visibility: visible; transform: none; }
.sc { position: relative; cursor: help; outline: none; }
.sc:hover, .sc:focus-visible { box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3.5px currentColor; }
.tip-stat { width: 250px !important; max-width: min(250px, 80vw) !important; display: grid; gap: 2px; }
.tip-stat .srow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 8px; align-items: baseline; padding: 2px 0; border-top: 1px dashed #45424d; }
.tip-stat b + .srow { border-top: 0; }
.tip-stat .sk { color: #cfcbbf; font-size: 12px; }
.tip-stat .sv { font-variant-numeric: tabular-nums; font-weight: 700; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.tip-stat .sg { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 4px; }
.tip-stat .sg.up { background: #2a4ca0; } .tip-stat .sg.dn { background: #c42f3a; }
.tip-stat .sr { font-size: 11px; color: #9a978d; font-weight: 400; }
.tip-stat .sn { grid-column: 2; font-size: 11px; color: #9fc3ff; line-height: 1.4; }
.chip.ab { color: var(--red); border: 1.5px dashed var(--red); background: var(--paper-2); }
.chip.ab.on { background: var(--red); color: #fff; border-style: solid; }
.tip .tipx { display: block; margin-top: 6px; padding-top: 5px; border-top: 1px dashed #55525d; color: #cfcbbf; font-size: 12px; }
.sc .tip { white-space: pre-line !important; }
.sc .tip { position: absolute; top: calc(100% + 10px); left: 0; z-index: 40; width: max-content; max-width: min(260px, 70vw);
  background: var(--ink); color: #fff; padding: 9px 11px; border-radius: 10px; font-size: 12.5px; line-height: 1.55; white-space: normal;
  box-shadow: 3px 3px 0 var(--red); opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .15s, transform .15s, visibility .15s; pointer-events: none; text-align: left; font-weight: 400; }
.sc .tip::before { content: ""; position: absolute; top: -6px; left: 14px; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.sc .tip b { display: block; font-weight: 700; color: var(--tape); margin-bottom: 2px; font-size: 13px; }
.plate.r .sc .tip { left: auto; right: 0; }
.plate.r .sc .tip::before { left: auto; right: 14px; }
.tt .tip::before { content: ""; position: absolute; top: -6px; left: 12px; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.tt .tip b { display: block; font-weight: 700; color: var(--tape); margin-bottom: 4px; font-size: 13px; }
.tip-type { width: 300px !important; max-width: min(300px, 82vw) !important; display: grid; gap: 4px; }
.mrow .tt .tip, .mrow .sc .tip { top: calc(100% + 8px); }
.mrow .tip-type .trow { grid-template-columns: 104px minmax(0, 1fr); }
.hidtag { cursor: help; }
.tip-type .trow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px; align-items: start; }
.tip-type .tl { color: #cfcbbf; font-size: 12px; padding-top: 3px; }
.tip-type .tv { display: flex; flex-wrap: wrap; gap: 3px 4px; align-items: center; }
.tip-type .tv .chip { font-size: 11px; padding: 3px 6px; }
.tip-type .tx { font-size: 11px; color: #fff; margin-right: 4px; font-variant-numeric: tabular-nums; }
.tip-type .tx.hi { color: #ff9b8f; font-weight: 700; } .tip-type .tx.lo { color: #9fc3ff; }
.tip-type .tn { color: #9a978d; font-size: 12px; padding-top: 2px; }
.tip-type .tsep { margin-top: 4px; padding-top: 6px; border-top: 1px dashed #55525d; color: var(--tape); font-size: 12px; font-weight: 600; }
.plate.r .tt .tip { left: auto; right: 0; }
.plate.r .tt .tip::before { left: auto; right: 12px; }
.tip.shifted::before { display: none; }
.plate.r .abil .tip { left: auto; right: 0; }
.plate.r .abil .tip::before { left: auto; right: 16px; }
.abil.flash { animation: abflash .9s ease-out; }
@keyframes abflash { 0%, 60% { background: var(--red); color: #fff; transform: scale(1.12); } 100% { transform: none; } }
.hpbar { height: 14px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--hp-ok); transition: width .45s ease, background-color .3s; }
.hpbar i.mid { background: var(--hp-mid); } .hpbar i.low { background: var(--hp-low); }
.hprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; }
.pips { display: flex; gap: 4px; }
.pips span { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--hp-ok); }
.pips span.dead { background: var(--paper); position: relative; }
.pips span.dead::after { content: ""; position: absolute; inset: 4px -2px auto; height: 1.5px; background: var(--red); transform: rotate(-35deg); }
.pips span.cur { outline: 2px solid var(--red); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; }
.plate.r .row1, .plate.r .hprow { flex-direction: row-reverse; }
.plate.r .who { margin-left: 0; margin-right: auto; }
.plate.r .chips, .plate.r .pips { justify-content: flex-end; }
.vs { display: grid; place-items: center; align-content: center; gap: 2px; font-family: var(--f-hand); font-size: 22px; color: var(--pencil); text-align: center; line-height: 1.1; }
.vs .tmax { font-family: var(--f-body); font-size: 11px; color: var(--pencil); margin-top: 2px; }
.vs .tmax.warn { color: var(--red); font-weight: 700; }
.vs b { font-size: 40px; color: var(--ink); font-weight: 400; }

.field { position: relative; aspect-ratio: 16 / 8; max-height: 56vh; width: 100%; border: 1.5px solid var(--ink); border-radius: 16px; overflow: hidden;
  background-color: var(--paper-2);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px; }
.field::before { content: ""; position: absolute; left: 0; right: 0; top: 64%; border-top: 1.5px dashed var(--rule); }
.mon { position: absolute; bottom: 8%; width: 38%; height: 82%; display: flex; align-items: flex-end; justify-content: center; }
.mon.p0 { left: 6%; } .mon.p1 { right: 6%; }
.mon .ground { position: absolute; bottom: -2%; left: 15%; right: 15%; height: 12%; border-radius: 50%; border: 1.5px solid var(--pencil); opacity: .5; }
.mon .face { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.mon.p1 .face { transform: scaleX(-1); } /* 立绘统一朝右，对手镜像成朝左 */
.mon img { position: relative; max-height: 100%; max-width: 100%; object-fit: contain; transform-origin: 50% 90%; filter: drop-shadow(0 6px 0 var(--shade)); }
.mon.fainted img { animation: faint .6s forwards; }
@keyframes faint { to { transform: translateY(25%) scaleY(.6); opacity: 0; } }
.mon.enter img { animation: enter .45s ease-out; }
@keyframes enter { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.mon.lunge0 img { animation: lunge0 .38s ease-in-out; } .mon.lunge1 img { animation: lunge1 .38s ease-in-out; }
@keyframes lunge0 { 50% { transform: translateX(18%) rotate(4deg); } }
@keyframes lunge1 { 50% { transform: translateX(18%) rotate(4deg); } }
.mon.hit img { animation: hit .4s; }
@keyframes hit { 15%, 55% { transform: translateX(-6%); filter: drop-shadow(0 0 0 var(--red)) brightness(1.6) sepia(1) hue-rotate(-40deg) saturate(6); } 35%, 75% { transform: translateX(6%); } }
.mon.heal img { animation: healf .45s; }
@keyframes healf { 50% { filter: sepia(1) hue-rotate(60deg) saturate(4); } }
.float { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-family: var(--f-hand); font-size: 44px; line-height: 1; color: var(--red); pointer-events: none; animation: rise .9s ease-out forwards; text-shadow: 2px 2px 0 var(--paper-2); white-space: nowrap; }
.float.crit { font-size: 58px; }
.float.heal { color: var(--hp-ok); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 20px); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -50px); } }
.banner { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); font-family: var(--f-hand); font-size: 34px; padding: 2px 18px; background: var(--tape); opacity: 0; pointer-events: none; white-space: nowrap; }
.banner.show { animation: ban .9s ease-out; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, -6px) rotate(-2deg); } 15%, 75% { opacity: 1; transform: translate(-50%, 0) rotate(-2deg); } 100% { opacity: 0; } }
.endcard { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(251, 250, 243, .82); }
.endcard .box { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 18px 26px; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
.endcard h3 { margin: 0; font-family: var(--f-hand); font-weight: 400; font-size: 64px; line-height: 1; color: var(--red); }
.endcard .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.console { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; align-items: stretch; }
.cmd { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tab { cursor: pointer; border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 14px; background: transparent; font-weight: 600; }
.tab.on { background: var(--ink); color: #fff; }
.tab.quit { margin-left: auto; color: var(--red); border-color: var(--red); }
.tab.speed { border-style: dashed; font-weight: 400; font-size: 13px; }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mv { cursor: pointer; text-align: left; display: grid; gap: 3px; padding: 9px 11px 9px 14px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--paper); position: relative; overflow: hidden; min-width: 0; }
.mv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--tc, var(--pencil)); }
.mv:hover:not(:disabled) { background: var(--paper-2); transform: translateY(-1px); box-shadow: 2px 2px 0 var(--ink); }
.mv:disabled { opacity: .45; cursor: not-allowed; }
.mv .t1 { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.mv .mn { font-weight: 700; font-size: 15px; color: var(--red); }
.mv .pp { font-size: 12px; color: var(--pencil); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mv .t2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--pencil); }
.mv .eff2 { color: #fff; background: var(--red); border-radius: 4px; padding: 0 5px; font-size: 11px; }
.mv .eff0 { color: var(--pencil); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; font-size: 11px; }
.mv .md { font-size: 12px; color: var(--blue); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tm { cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper); min-width: 0; }
.tm:disabled { opacity: .45; cursor: not-allowed; }
.tm:hover:not(:disabled) { background: var(--paper-2); box-shadow: 2px 2px 0 var(--ink); }
.tm img { width: 54px; height: 54px; object-fit: contain; }
.tm .nm { font-family: var(--f-hand); font-size: 22px; line-height: 1; color: var(--red); }
.tm .hpbar { height: 8px; border-width: 1px; margin-top: 4px; }
.tm .hpt { font-size: 11px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.cmd .hint.alert { color: var(--red); font-weight: 600; }

.logbox { background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; }
.logbox h4 { margin: 0 0 6px; font-family: var(--f-hand); font-weight: 400; font-size: 24px; }
.log { flex: 1; overflow-y: auto; max-height: 300px; min-height: 160px; font-size: 13px; line-height: 1.55; padding-right: 4px;
  background-image: linear-gradient(transparent calc(1.55em - 1px), var(--grid) 1px); background-size: 100% 1.55em; background-attachment: local; }
.log p { margin: 0; color: var(--ink); }
.log p b { color: var(--red); font-weight: 600; }
.log p.turn { color: var(--pencil); font-family: var(--f-hand); font-size: 18px; margin-top: 4px; }
.log p.fxl, .log p.good { color: var(--blue); }
.log p.bad, .log p.crit { color: var(--red); }
.log p.dmg { color: var(--pencil); }
.log p.use { font-weight: 600; }

@media (max-width: 860px) {
  .build { grid-template-columns: minmax(0, 1fr); }
  .console { grid-template-columns: minmax(0, 1fr); }
  .field { aspect-ratio: 4 / 3; }
}
@media (max-width: 560px) {
  .masthead h1 { font-size: 32px; }
  .bag { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .d-head { grid-template-columns: 110px minmax(0, 1fr); }
  .d-art { height: 130px; } .d-art img { max-height: 120px; }
  .plates { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .vs { display: none; }
  .plate { padding: 10px; } .plate .pn { font-size: 24px; }
  .mgrid { grid-template-columns: minmax(0, 1fr); }
  .mon { width: 46%; }
  .tgrid { grid-template-columns: minmax(0, 1fr); }
}

/* ============ 账号 / 顶栏 / 各大栏 ============ */
.topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.topbar .masthead { margin: 0; }
.acct { position: relative; display: flex; align-items: center; gap: 8px; }
.who-btn { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 12px 4px 4px; background: var(--paper-2); box-shadow: 2px 2px 0 var(--ink); max-width: 100%; }
.who-btn .av { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--f-hand); font-size: 18px; flex: none; }
.who-btn .lab { font-size: 11px; color: var(--pencil); }

.who-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px; display: grid; gap: 8px; width: 230px; box-shadow: 3px 3px 0 var(--ink); }
.who-menu p { margin: 0; font-size: 12.5px; color: var(--pencil); }
.who-menu .btn { padding: 6px 10px; font-size: 13px; }
.who-menu .btn.danger { color: var(--red); border-color: var(--red); box-shadow: none; }
.who-menu .btn.danger.armed { background: var(--red); color: #fff; }
.mainnav { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nav { cursor: pointer; border: 1.5px solid var(--ink); border-radius: 12px 12px 4px 4px; background: var(--paper-2); padding: 8px 6px 6px; display: grid; justify-items: center; gap: 0; font-family: var(--f-hand); font-size: 24px; line-height: 1.1; color: var(--ink); }

.nav.on { background: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--red); }
.nav.on small { color: #d8d4c8; }

.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 4px 0 12px; }
.arena-sub { margin: -4px 0 12px; }
.welcome { display: flex; align-items: center; gap: 12px; background: var(--tape); border: 1.5px solid var(--ink); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }

.teams { display: grid; gap: 16px; margin-bottom: 18px; }
.teambox { position: relative; background: var(--paper-2); border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px 14px 12px; }
.teambox.active { box-shadow: 4px 4px 0 var(--red); }
.team-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 10px; }
.team-head h3 { margin: 0; font-family: var(--f-hand); font-weight: 400; font-size: 28px; line-height: 1; }
.team-head .cnt { color: var(--pencil); font-size: 13px; font-variant-numeric: tabular-nums; }
.team-head .act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.badge-on { font-size: 12px; font-weight: 700; color: #fff; background: var(--red); border-radius: 999px; padding: 3px 10px; }
.team-head .btn { padding: 5px 12px; font-size: 13px; }
.slot.addslot { cursor: pointer; color: var(--pencil); justify-content: center; min-height: 128px; font-size: 13px; }
.slot.addslot:hover { border-color: var(--ink); color: var(--ink); }
.slot.addslot .plus { font-size: 28px; line-height: 1; }
.slot .lv { font-size: 12px; color: var(--pencil); font-variant-numeric: tabular-nums; }
.picker { margin-top: 12px; border-top: 1.5px dashed var(--rule); padding-top: 10px; display: grid; gap: 8px; }
.picker-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }

    x.to = R.r; x.toStars = R.stars; saveRank(); return x;
  }
  function showEnd() {
    var S = app.S, r = S.over;
    if (S.training) {
      var L = S.training.log, tot = L.reduce(function (a, x) { return a + x.amt; }, 0), turns = Math.max(0, S.turn - (S.training.t0 || 1));
      $('end-title').textContent = r === 'lose' ? '训练中断' : '训练结束';
      $('end-sub').textContent = (r === 'lose' ? '我方精灵倒下了 · ' : '') + '共 ' + turns + ' 回合 · 总伤害 ' + tot + ' · 平均每回合 ' + (turns ? Math.round(tot / turns) : 0);
      $('end-rank').hidden = true;
      $('btn-again').textContent = '重新开始训练'; $('btn-back').textContent = '回到训练设置';
      $('endcard').hidden = false; refreshCmd(); return;
    }
    $('btn-back').textContent = '回到背包';
    $('end-title').textContent = r === 'win' ? '胜利！' : r === 'lose' ? '失败了' : '平局';
    var left = aliveIdx(S, 0).length;
    $('end-sub').textContent = (S.timeUp ? '达到 ' + MAX_TURNS + ' 回合上限，按剩余精灵数判定 · 你剩 ' + left + ' 只，对手剩 ' + aliveIdx(S, 1).length + ' 只' : '共 ' + (S.turn - 1) + ' 回合 · 你的背包还剩 ' + left + ' 只精灵能战斗');
    var rr = $('end-rank'); rr.hidden = !rankOn(); rr.innerHTML = '';
    if (rankOn()) {
      if (!S.rankApplied) { S.rankApplied = applyRank(r); }
      var x = S.rankApplied;
      rr.innerHTML = '<div class="er-row">' + rankBadge(x.from) + starsHTML(x.fromStars, x.from) + '<span class="er-arrow">→</span>' + rankBadge(x.to) + starsHTML(x.toStars, x.to) + '</div>' +
        '<p class="er-msg ' + (x.kind === 'up' ? 'up' : x.kind === 'down' ? 'down' : '') + '">' + esc(x.msg) + '</p>' +
        '<p class="hint">对手阵容：' + S.sides[1].team.map(function (t) { return SPMAP[t.id].name; }).join('、') + '</p>';
    }
    $('btn-again').textContent = rankOn() ? '下一局 · 重新选择阵容' : '同样的背包再来一局';
    $('endcard').hidden = false;
    refreshCmd();
  }

  $('mgrid').addEventListener('click', function (e) { var b = e.target.closest('[data-mi]'); if (b && !b.disabled) doTurn({ kind: 'move', i: +b.dataset.mi }); });
  $('tgrid').addEventListener('click', async function (e) {
    var b = e.target.closest('[data-ti]'); if (!b || b.disabled || busy) return;
    var k = +b.dataset.ti, S = app.S;
    if (S.needSwitch) {
      busy = true; refreshCmd();
      await play(playerReplace(S, k));
      busy = false; showTab('moves'); afterTurn();
    } else { showTab('moves'); doTurn({ kind: 'switch', to: k }); }
  });
  $('tab-moves').addEventListener('click', function () { showTab('moves'); });
  $('tab-team').addEventListener('click', function () { showTab('team'); });
  $('btn-speed').addEventListener('click', function () { app.fast = !app.fast; this.textContent = '动画：' + (app.fast ? '快速' : '正常'); });
  $('btn-quit').addEventListener('click', function () {
    var b = this;
    if (busy || !app.S || app.S.over) return;
    if (app.S.training) { app.S.over = 'train'; showEnd(); return; }
    if (Date.now() - quitArmed < 3000) { app.S.over = 'lose'; addLog('你认输了。', 'bad'); b.textContent = '认输'; showEnd(); return; }
    quitArmed = Date.now(); b.textContent = '再点一次确认';
    setTimeout(function () { b.textContent = '认输'; }, 3000);
  });
  $('btn-again').addEventListener('click', function () { if (rankOn()) { $('btn-back').click(); return; } $('log').innerHTML = ''; startBattle(); });
  $('btn-back').addEventListener('click', function () {
    app.screen = 'builder'; app.S = null; $('statsbox').hidden = true; $('battle').hidden = true; $('builder').hidden = false; $('log').innerHTML = ''; renderMode(); renderBuilder();
  });
  document.addEventListener('keydown', function (e) {
    if (app.screen !== 'battle' || busy || !app.S || app.S.over || e.metaKey || e.ctrlKey) return;
    var n = +e.key; if (n >= 1 && n <= 4) { var b = $('mgrid').querySelector('[data-mi="' + (n - 1) + '"]'); if (b && !b.disabled) doTurn({ kind: 'move', i: n - 1 }); }
  });

  /* ---------------- 启动 & 热更新保留进度 ---------------- */
  function start(data) {
    try {
      if (data && data.app && data.app.loadout) {
        var d = data.app;
        if (d.mode) app.mode = d.mode;
        app.loadout = d.loadout; app.bag = d.bag; app.sel = d.sel || app.bag[0] || 'dragon'; app.fast = !!d.fast;
        $('btn-speed').textContent = '动画：' + (app.fast ? '快速' : '正常');
        if (d.screen === 'battle' && d.S) {
          app.S = d.S; app.screen = 'battle'; app.lastP = d.lastP;
          $('builder').hidden = true; $('battle').hidden = false;
          $('log').innerHTML = d.logHTML || ''; app.logHTML = d.logHTML || '';
          renderSnap(snap(app.S), true); showTab(app.S.needSwitch ? 'team' : 'moves'); refreshCmd();
          if (app.S.over) showEnd();
          return;
        }
      }
    } catch (err) { /* 旧进度不兼容就从头开始 */ }
    renderMode(); renderBuilder();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () {
      return { app: { mode: app.mode, loadout: app.loadout, bag: app.bag, sel: app.sel, fast: app.fast, screen: busy ? 'builder' : app.screen, S: busy ? null : app.S, lastP: app.lastP, logHTML: app.logHTML } };
    });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
<script>
/* ============ 账号系统：创建账号、初始精灵、精灵背包（配队）、精灵仓库、星际探索 ============ */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var H = window.HSUI, esc = H.esc, tchip = H.tchip, tchips = H.tchips, atkTip = H.atkTip;
  var KEY = 'hs-account-v1', PKEY = 'hs-page';
  var STARTERS = ['leaf', 'squid', 'shroom'], START_LV = 5, NAME_MAX = 10, TEAM_N = 2, TEAM_SIZE = 5;
  var TEAM_NAME = ['配队一', '配队二'];
  var BASE_NAME = { hp: '体力', atk: '物攻', def: '物防', spa: '特攻', spd: '特防', spe: '速度' };
  var STAGE = ['一阶', '二阶', '最终形态'];
  var acc = null, page = 'arena';
  var ui = { sel: null, pick: -1, ob: { step: 1, name: '', starter: null }, f: { type: '', min: 1, max: 100, sort: 'lvd' }, resetArmed: 0, welcome: false };

  /* ---------- 存档 ---------- */
  function valid(a) { return a && typeof a.name === 'string' && Array.isArray(a.mons) && Array.isArray(a.teams); }
  try { var raw = JSON.parse(localStorage.getItem(KEY) || 'null'); if (valid(raw)) acc = raw; } catch (e) {}
  try { var pg = localStorage.getItem(PKEY); if (pg) page = pg; } catch (e) {}
  if (acc) {   // 清理坏数据
    acc.mons = acc.mons.filter(function (m) { return SPMAP[m.sid]; });
    while (acc.teams.length < TEAM_N) acc.teams.push([]);
    acc.teams = acc.teams.map(function (t) { return t.filter(function (u, i) { return mon(u) && t.indexOf(u) === i; }).slice(0, TEAM_SIZE); });
    if (!(acc.active >= 0 && acc.active < TEAM_N)) acc.active = 0;
    if (acc.introDone == null) acc.introDone = acc.mons.length > 0;   // 旧存档：已有精灵视为看过序章
    if (acc.starter && !acc.rival) acc.rival = rivalOf(acc.starter);
    acc.mons.forEach(function (m) { if (!(m.exp >= expAt(m.lv))) m.exp = expAt(m.lv); });
    if (!(acc.exp >= 0)) acc.exp = 0; if (!(acc.energy >= 0)) acc.energy = 0;
  }
  function ready() { return !!(acc && acc.introDone); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(acc)); } catch (e) {} }
  function savePage() { try { localStorage.setItem(PKEY, page); } catch (e) {} }

  /* ---------- 精灵实例 ---------- */
  function mon(u) { if (!acc) return null; for (var i = 0; i < acc.mons.length; i++) if (acc.mons[i].u === u) return acc.mons[i]; return null; }
  function stageOf(s, lv) { return lv >= s.evo[2].lv ? 2 : lv >= s.evo[1].lv ? 1 : 0; }
  function form(m) {
    var s = SPMAP[m.sid], st = stageOf(s, m.lv), n = st < 2 ? s.evo[st].n : s.name, unsure = false;
    if (n && n.slice(-1) === '?') { n = n.slice(0, -1); unsure = true; }
    if (!n) n = s.name + '·' + STAGE[st];
    var img = st < 2 ? (PRE_SPRITES[s.id + '_s' + (st + 1)] || SPRITES[s.id]) : SPRITES[s.id];
    return { name: n, img: img, stage: st, unsure: unsure };
  }
  function avail(sid, lv) { var s = SPMAP[sid]; return s.moves.concat(lv >= 50 ? s.hidden : []); }
  function defaultMoves(sid, lv) {
    var s = SPMAP[sid], a = avail(sid, lv), out = s.def.filter(function (n) { return a.indexOf(n) >= 0; });
    a.forEach(function (n) { if (out.length < 4 && out.indexOf(n) < 0) out.push(n); });
    return out;
  }
  function newMon(sid, lv) { var m = { u: acc.next++, sid: sid, lv: lv, exp: expAt(lv), moves: defaultMoves(sid, lv), got: Date.now() }; acc.mons.push(m); return m; }
  /* 经验：到达某等级所需的累计经验 = 等级³（LV5 为 125，LV100 为 1,000,000） */
  var MAX_LV = 100;
  function expAt(lv) { return lv * lv * lv; }
  function lvOf(exp) { var lv = Math.max(1, Math.floor(Math.cbrt(exp))); while (lv < MAX_LV && expAt(lv + 1) <= exp) lv++; while (lv > 1 && expAt(lv) > exp) lv--; return Math.min(lv, MAX_LV); }
  function fmt(n) { return Math.floor(n).toLocaleString('en-US'); }
  function giveExp(m, amt) {
    var room = expAt(MAX_LV) - m.exp; amt = Math.max(0, Math.min(amt, room, acc.exp)); if (!amt) return null;
    var before = { lv: m.lv, name: form(m).name, stage: form(m).stage };
    m.exp += amt; acc.exp -= amt; m.lv = lvOf(m.exp);
    var after = form(m), msg = form(m).name + ' 获得了 ' + fmt(amt) + ' 点经验';
    if (m.lv > before.lv) msg += '，升到了 LV' + m.lv + '！';
    else msg += '。';
    if (after.stage > before.stage) msg += before.name + ' 进化成了 ' + after.name + '！';
    if (before.lv < 50 && m.lv >= 50 && SPMAP[m.sid].hidden.length) msg += '隐藏技能现在可以选用了。';
    return msg;
  }
  function teamsOf(u) { var r = []; acc.teams.forEach(function (t, i) { var k = t.indexOf(u); if (k >= 0) r.push({ t: i, lead: k === 0 }); }); return r; }
  function stat(m, k) { return calcStat(SPMAP[m.sid].base[k], k, m.lv); }

  /* ---------- 顶栏、导航 ---------- */
  function renderTop() {
    document.body.classList.toggle('no-acc', !ready());
    $('onboard').hidden = ready();
    if (!ready()) { renderOnboard(); return; }
    if (prog('school').done && !prog('school').rewarded) grant('school');   // 旧存档补发序章奖励
    $('who-name').textContent = acc.name;
    $('res').innerHTML = '<span class="res-chip" title="经验背包里的累积经验，可分配给精灵">经验 <b>' + fmt(acc.exp) + '</b></span><span class="res-chip en" title="能量（货币）">能量 <b>' + fmt(acc.energy) + '</b></span>';
    $('who-av').textContent = Array.from(acc.name)[0] || '?';
    $('who-info').textContent = '训练师「' + acc.name + '」 · 拥有精灵 ' + acc.mons.length + ' 只 · 创建于 ' + new Date(acc.created).toLocaleDateString('zh-CN');
    [].forEach.call(document.querySelectorAll('#mainnav .nav'), function (b) {
      var on = b.dataset.page === page; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    });
    ['arena', 'bag', 'store', 'explore'].forEach(function (p) { $('pg-' + p).hidden = p !== page; });
    if (page === 'bag') renderBag();
    else if (page === 'store') renderStore();
    else if (page === 'explore') renderExplore();
  }
  function go(p) { if (ex.mode === 'replay' && p !== 'explore') { stopTimers(); ex.mode = null; ex.view = 'sites'; } page = p; ui.pick = -1; savePage(); renderTop(); window.scrollTo(0, 0); }
  $('mainnav').addEventListener('click', function (e) { var b = e.target.closest('[data-page]'); if (b && !b.disabled) go(b.dataset.page); });
  // 竞技对战进行中时锁住其他大栏，避免中途离开
  function syncBattle() {
    var inB = !$('battle').hidden;
    [].forEach.call(document.querySelectorAll('#mainnav .nav'), function (b) {
      b.disabled = inB && b.dataset.page !== 'arena'; b.title = b.disabled ? '对战进行中，结束后才能切换' : '';
    });
  }
  new MutationObserver(syncBattle).observe($('battle'), { attributes: true, attributeFilter: ['hidden'] });
  // 账号菜单
  $('who-btn').addEventListener('click', function (e) {
    e.stopPropagation(); var m = $('who-menu'); m.hidden = !m.hidden; $('who-btn').setAttribute('aria-expanded', !m.hidden);
    ui.resetArmed = 0; $('btn-reset').classList.remove('armed'); $('btn-reset').textContent = '重置存档';
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('#who')) { $('who-menu').hidden = true; $('who-btn').setAttribute('aria-expanded', false); } });
  $('btn-reset').addEventListener('click', function () {
    if (!ui.resetArmed) { ui.resetArmed = 1; this.classList.add('armed'); this.textContent = '确定重置？再点一次'; return; }
    acc = null; try { localStorage.removeItem(KEY); } catch (e) {}
    ui = { sel: null, pick: -1, ob: { step: 1, name: '', starter: null }, f: { type: '', min: 1, max: 100, sort: 'lvd' }, resetArmed: 0, welcome: false };
    stopTimers(); ex.view = 'planets'; ex.mode = null;
    $('who-menu').hidden = true; page = 'arena'; savePage(); renderTop();
  });

  /* ---------- 创建账号：输入名字 → 直接进入省实验中学序章，在张老师指引下挑选精灵 ---------- */
  function clip(v) { return Array.from(v).slice(0, NAME_MAX).join(''); }
  function renderOnboard() {
    var ob = ui.ob, el = $('onboard');
    if (acc && !acc.introDone) { if (ex.mode !== 'intro' || !$('vn')) startVN('school', 'intro', el, false); return; }
    el.innerHTML = '<div class="onboard"><span class="tape l"></span><span class="tape r"></span>' +
      '<h2>欢迎来到手绘精灵对战</h2>' +
      '<p>请先创建账号。给自己起一个训练师名字，最多 ' + NAME_MAX + ' 个字。</p>' +
      '<form class="namebox" id="ob-form"><input id="ob-name" type="text" autocomplete="off" spellcheck="false" placeholder="输入训练师名字" aria-label="训练师名字" value="' + esc(ob.name) + '">' +
      '<span class="cnt" id="ob-cnt"></span><button class="btn primary" id="ob-next" type="submit">开始</button></form>' +
      '<p class="hint" id="ob-msg">名字会显示在页面最上方，也会出现在剧情对话里。</p></div>';
    var inp = $('ob-name');
    var sync = function () {
      var v = clip(inp.value); if (v !== inp.value) inp.value = v; ob.name = v;
      var n = Array.from(v.trim()).length; $('ob-cnt').textContent = Array.from(v).length + ' / ' + NAME_MAX; $('ob-next').disabled = !n;
    };
    inp.addEventListener('input', sync); sync();
    $('ob-form').addEventListener('submit', function (e) { e.preventDefault(); if (!ob.name.trim()) return; createAccount(ob.name.trim()); });
    setTimeout(function () { try { inp.focus(); } catch (er) {} }, 0);
  }
  $('onboard').addEventListener('click', function (e) { if (ex.mode === 'intro' && $('vn')) vnClick(e); });
  function createAccount(name) {
    acc = { v: 1, name: name, created: Date.now(), starter: null, rival: null, next: 1, mons: [], teams: [[], []], active: 0, introDone: false, story: {}, exp: 0, energy: 0 };
    save(); renderTop(); window.scrollTo(0, 0);
  }
  // 序章里选定初始精灵；Vanber 选克制主角的那只
  function rivalOf(sid) {
    var t = SPMAP[sid].types[0];
    return STARTERS.filter(function (x) { return x !== sid && eff(SPMAP[x].types[0], t) > 1; })[0] || STARTERS.filter(function (x) { return x !== sid; })[0];
  }
  function pickStarter(sid) {
    acc.starter = sid; acc.rival = rivalOf(sid);
    var m = newMon(sid, START_LV); acc.teams[0] = [m.u]; acc.active = 0; ui.sel = m.u; save();
  }
  function finishIntro() {
    acc.introDone = true; ex.mode = null; ex.view = 'planets'; stopTimers(); save();
    $('onboard').innerHTML = '';
    ui.welcome = true; page = 'bag'; savePage(); renderTop(); window.scrollTo(0, 0);
  }

  /* ---------- 共用：精灵卡片、资料面板 ---------- */
  function monCard(m, cls, extra) {
    var f = form(m), s = SPMAP[m.sid];
    return '<span class="cimg"><img src="' + f.img + '" alt=""></span><span class="nm">' + esc(f.name) + '</span><span class="lv">LV' + m.lv + '</span><span class="tc">' + tchips(s.types) + '</span>' + (extra || '');
  }
  function evoLine(m) {
    var s = SPMAP[m.sid], st = stageOf(s, m.lv);
    return '<div class="evo-line">' + s.evo.map(function (e, i) {
      var n = i < 2 ? e.n : s.name; n = n ? n.replace('?', '') : s.name + '·' + STAGE[i];
      if (s.placeholder && i > 0) n = '？';
      return (i ? '<span>→ LV' + e.lv + ' →</span>' : '') + '<b class="' + (i === st ? 'cur' : '') + '">' + esc(n) + '</b>';
    }).join('') + '</div>';
  }
  function monDetail(m) {
    if (!m) return '<p class="empty-note">点击一只精灵查看资料、配置技能。</p>';
    var s = SPMAP[m.sid], f = form(m), a = avail(m.sid, m.lv), n = m.moves.length, ts = teamsOf(m.u);
    var stats = '';
    ['hp', 'atk', 'def', 'spa', 'spd', 'spe'].forEach(function (k) {
      var b = s.base[k], v = stat(m, k);
      stats += '<span>' + BASE_NAME[k] + '</span><span>' + v + '</span><span class="bar"><i style="width:' + Math.min(100, b / 150 * 100) + '%"></i></span><span class="real">种族值 ' + b + '</span>';
    });
    stats += '<span class="sum">左侧为 LV' + m.lv + ' 时的实际能力值' + (s.placeholder ? ' · 数值为占位' : s.unsure && s.unsure.length >= 6 ? ' · 种族值暂定' : '') + '</span>';
    var row = function (mv) {
      var M_ = M[mv], on = m.moves.indexOf(mv) >= 0, ok = a.indexOf(mv) >= 0, id = 'am-' + m.u + '-' + mv;
      var meta = M_.cat + (M_.power ? ' · 威力' + M_.power : '') + (M_.pri ? ' · 先制+' + M_.pri : '') + ' · PP' + M_.pp;
      return '<label class="mrow' + (on ? ' on' : '') + (M_.hidden ? ' hid' : '') + (ok ? '' : ' locked') + '" for="' + id + '">' +
        '<input type="checkbox" id="' + id + '" data-amove="' + mv + '"' + (on ? ' checked' : '') + (ok ? '' : ' disabled') + '>' +
        '<span class="l1"><span class="mn">' + M_.name + '</span>' + atkTip(M_.type) + '<span class="mm">' + meta + '</span>' +
        (M_.hidden ? '<span class="tag sc hidtag" tabindex="0">隐藏<span class="tip" role="tooltip"><b>学习条件</b>' + esc(LEARN[mv] || '图鉴里没写') + '，且达到 LV50 习得</span></span>' : '') +
        (ok ? '' : '<span class="lock">LV50 习得</span>') + '</span><span class="md">' + esc(M_.d) + '</span></label>';
    };
    var acts = acc.teams.map(function (t, i) {
      var k = t.indexOf(m.u);
      if (k >= 0) return (k > 0 ? '<button class="btn" type="button" data-lead="' + i + '">设为' + TEAM_NAME[i] + '首发</button>' : '') + '<button class="btn ghost" type="button" data-out="' + i + '">移出' + TEAM_NAME[i] + '</button>';
      return '<button class="btn primary" type="button" data-in="' + i + '"' + (t.length >= TEAM_SIZE ? ' disabled title="' + TEAM_NAME[i] + '已满 5 只"' : '') + '>加入' + TEAM_NAME[i] + '</button>';
    }).join('');
    return '<span class="tape r"></span>' +
      '<div class="d-head"><div class="d-art"><img src="' + f.img + '" alt="' + esc(f.name) + '"></div><div>' +
      '<h3>' + esc(f.name) + (f.unsure ? '<i class="q" title="字迹没看清">?</i>' : '') + '</h3>' +
      '<p style="margin:0 0 6px"><span class="lvbig">LV' + m.lv + '</span>' + tchips(s.types) + '</p>' +
      '<p class="hint">' + STAGE[f.stage] + (f.stage < 2 ? ' · 最终进化为' + (s.placeholder ? '？' : s.name) : '') +
      (ts.length ? ' · ' + ts.map(function (x) { return TEAM_NAME[x.t] + (x.lead ? '首发' : ''); }).join('、') : ' · 未加入配队') + '</p>' +
      evoLine(m) + (s.placeholder ? '<p class="placeholder-note" style="margin-top:6px">还没画出来，形象、数值和技能均为占位</p>' : '') + '</div></div>' +
      expBox(m) +
      '<div class="stats">' + stats + '</div>' +

      (intro ? '' : '<p class="hint vn-tip">点击画面、按空格或回车继续；人物立绘目前为占位。</p>');
    show();
    try { $('vn').focus({ preventScroll: true }); } catch (er) {}
  }
  function stopTimers() { clearTimeout(ex.timer); clearInterval(ex.tick); ex.timer = null; ex.tick = null; }
  function setBg(k) {
    if (ex.curBg === k) return;
    var a = $('vn-bg'), b = $('vn-bg2');
    if (!ex.curBg) { a.src = BG[k]; } else { b.src = BG[k]; b.classList.remove('in'); void b.offsetWidth; b.classList.add('in'); setTimeout(function () { if (a.isConnected) { a.src = BG[k]; b.classList.remove('in'); } }, 520); }
    a.style.objectPosition = b.style.objectPosition = BG_POS[k] || '';
    ex.curBg = k; $('vn-spot').textContent = ' · ' + (BG_NAME[k] || '');
  }
  function monsHTML(mode) {
    var img = function (sid, cls, label) { return '<figure class="vn-mon ' + cls + '"><img src="' + form({ sid: sid, lv: START_LV }).img + '" alt=""><figcaption>' + esc(label) + '</figcaption></figure>'; };
    if (mode === 'all') return STARTERS.map(function (sid, i) { return img(sid, ['a1', 'a2', 'a3'][i], monName(sid)); }).join('');
    if (mode === 'mine' && acc.starter) return img(acc.starter, 'me', starterName());
    if (mode === 'pair' && acc.starter) return img(acc.starter, 'me', starterName()) + (acc.rival ? img(acc.rival, 'rv', monName(acc.rival)) : '');
    return '';
  }
  function show() {
    stopTimers();
    var arr = SCRIPT[ex.site], pr = prog(ex.site);
    ex.i = stepAt(ex.i);
    if (ex.i >= arr.length) { finish(); return; }
    pr.at = ex.i; save();
    var st = arr[ex.i], on = carry(ex.i, 'on', []), mons = carry(ex.i, 'mons', '');
    setBg(carry(ex.i, 'bg', SITES[ex.site].bg));
    var monsH = monsHTML(mons); if ($('vn-mons').dataset.k !== mons + acc.starter) { $('vn-mons').innerHTML = monsH; $('vn-mons').dataset.k = mons + acc.starter; }
    $('vn-chars').innerHTML = on.map(function (o) {
      var k = o[0], pos = o[1], speak = st.s === k;
      return '<div class="vn-fig ' + pos + (speak ? ' speak' : st.s && st.s !== 'n' && !st.choice ? ' dim' : '') + '" style="--cc:' + CAST[k].color + '">' + standee(k) + '<span class="vn-tag">' + esc(CAST[k].name()) + '</span></div>';
    }).join('');
    $('vn-choices').hidden = true; $('vn-pick').hidden = true; $('vn-box').classList.remove('wait');
    if (st.choice) {
      $('vn-box').classList.add('wait'); $('vn-choices').hidden = false;
      $('vn-choices').innerHTML = st.choice.map(function (c) { return '<button type="button" class="vn-opt" data-ch="' + c.k + '">' + esc(fill(c.t)) + '</button>'; }).join('');
      ex.skip = false; syncBtns(); return;
    }
    if (st.pick) { ex.skip = false; ex.auto = false; syncBtns(); }
    var nar = st.s === 'n', name = nar ? '' : CAST[st.s].name();
    $('vn-name').textContent = name; $('vn-name').hidden = nar; $('vn-name').style.setProperty('--cc', nar ? '' : CAST[st.s].color);
    $('vn-box').classList.toggle('narr', nar);
    ex.full = fill(st.t); ex.shown = 0; ex.typing = true; $('vn-next').hidden = true;
    ex.log.push({ n: name, t: ex.full });
    var chars = Array.from(ex.full), txt = $('vn-text');
    if (ex.skip) { txt.textContent = ex.full; ex.typing = false; ex.timer = setTimeout(next, 70); return; }
    txt.textContent = '';
    ex.tick = setInterval(function () { ex.shown++; txt.textContent = chars.slice(0, ex.shown).join(''); if (ex.shown >= chars.length) doneTyping(); }, 32);
  }
  function doneTyping() {
    clearInterval(ex.tick); ex.tick = null; ex.typing = false;
    $('vn-text').textContent = ex.full;
    var st = SCRIPT[ex.site][ex.i];
    if (st && st.pick) { openPick(); return; }
    $('vn-next').hidden = false;
    if (ex.auto) ex.timer = setTimeout(next, 1200 + Array.from(ex.full).length * 45);
  }
  function openPick() {
    var el = $('vn-pick'), sel = ex.pickSel;
    el.hidden = false;
    el.innerHTML = '<div class="vp-cards" role="radiogroup" aria-label="选择初始精灵">' + STARTERS.map(function (sid) {
      var s = SPMAP[sid], f = form({ sid: sid, lv: START_LV });
      return '<button type="button" class="vp-card' + (sel === sid ? ' sel' : '') + '" role="radio" aria-checked="' + (sel === sid) + '" data-pk="' + sid + '">' +
        '<img src="' + f.img + '" alt=""><span class="nm">' + esc(f.name) + '</span><span class="tc">' + tchips(s.types) + '<span class="chip">LV' + START_LV + '</span></span>' +
        '<span class="ab">特性 · ' + esc(s.ability.n) + '</span><span class="ad">' + esc(s.ability.d) + '</span>' +
        (s.placeholder ? '<span class="placeholder-note">还没画出来，形象和数值均为占位</span>' : '') + '</button>';
    }).join('') + '</div><div class="vp-foot"><span>' + (sel ? '选择 <b>' + esc(monName(sel)) + '</b> 作为你的伙伴？选定后不能更换。' : '点击一只精灵') + '</span>' +
      '<button type="button" class="btn primary" data-vn="pickok"' + (sel ? '' : ' disabled') + '>就选它了</button></div>';
  }
  function next() {
    if (!$('vn')) return;
    if (ex.typing) { doneTyping(); return; }
    var st = SCRIPT[ex.site][ex.i]; if (st && (st.choice || st.pick)) return;
    ex.i++; show();
  }
  function finish() {
    stopTimers();
    var pr = prog(ex.site); pr.done = true; pr.at = 0; save();
    var R = grant(ex.site), intro = ex.mode === 'intro';
    var nxt = PLANETS[0].sites.filter(function (id) { return SITES[id].after === ex.site; })[0];
    ex.auto = false; ex.skip = false;
    $('vn-chars').innerHTML = ''; $('vn-mons').innerHTML = ''; $('vn-box').hidden = true; $('vn-choices').hidden = true;
    $('vn-end').hidden = false;
    $('vn-end').innerHTML = '<div class="vn-endbox"><span class="sc-tag">' + SITES[ex.site].chapter + '</span><b>完</b>' +
      (R ? '<p>获得奖励</p><div class="vn-reward"><span>累积经验 ×' + fmt(R.exp) + '</span><span>能量 ×' + fmt(R.energy) + '</span></div>' : '') +
      '<p>' + (nxt ? '下一段「' + SITES[nxt].chapter.split(' · ')[1] + '」已解锁，可在星际探索 · 地球中继续。' : '后续剧情正在制作中。') + '</p>' +
      '<div class="row">' + (intro ? '<button type="button" class="btn primary" data-vn="enter">进入游戏</button>'
        : '<button type="button" class="btn" data-vn="replay">重温一遍</button>' + (nxt ? '<button type="button" class="btn" data-vn="next" data-nx="' + nxt + '">继续下一段</button>' : '') + '<button type="button" class="btn primary" data-vn="exit">返回地点</button>') + '</div></div>';
    syncBtns();
  }
  function syncBtns() { var a = $('vn-auto'), s = $('vn-skip'); if (a) a.classList.toggle('on', ex.auto); if (s) s.classList.toggle('on', ex.skip); }
  function vnClick(e) {
    var b = e.target.closest('button');
    if (b && b.dataset.ch) { prog(ex.site).ch = b.dataset.ch; ex.i++; show(); return; }
    if (b && b.dataset.pk) { ex.pickSel = b.dataset.pk; openPick(); return; }
    if (b && b.dataset.vn) {
      var a = b.dataset.vn;
      if (a === 'pickok' && ex.pickSel) { pickStarter(ex.pickSel); ex.i++; show(); return; }
      if (a === 'exit') { stopTimers(); ex.mode = null; ex.view = 'sites'; renderExplore(); return; }
      if (a === 'replay') { startVN(ex.site, 'replay', ex.host, true); return; }
      if (a === 'next') { startVN(b.dataset.nx, 'replay', ex.host, prog(b.dataset.nx).done || !prog(b.dataset.nx).at); return; }
      if (a === 'enter') { finishIntro(); return; }
      if (a === 'auto') { ex.auto = !ex.auto; ex.skip = false; syncBtns(); if (ex.auto && !ex.typing && !ex.tick) ex.timer = setTimeout(next, 600); return; }
      if (a === 'skip') { ex.skip = !ex.skip; ex.auto = false; syncBtns(); if (ex.skip) { if (ex.typing) doneTyping(); next(); } return; }
      if (a === 'log') { openLog(); return; }
      if (a === 'logx') { $('vn-log').hidden = true; return; }
      return;
    }
    if (e.target.closest('#vn-log') || e.target.closest('#vn-end') || e.target.closest('.vn-top') || e.target.closest('#vn-pick')) return;
    if (!e.target.closest('#vn')) return;
    if (ex.skip) { ex.skip = false; syncBtns(); return; }
    next();
  }
  function openLog() {
    var l = $('vn-log');
    l.innerHTML = '<div class="vn-loghead"><b>对话记录</b><button type="button" class="btn ghost" data-vn="logx">关闭</button></div><div class="vn-logbody">' +
      (ex.log.length ? ex.log.map(function (x) { return '<p>' + (x.n ? '<b>' + esc(x.n) + '</b>' : '<i>旁白</i>') + esc(x.t) + '</p>'; }).join('') : '<p class="hint">还没有对话。</p>') + '</div>';
    l.hidden = false; var body = l.querySelector('.vn-logbody'); body.scrollTop = body.scrollHeight;
  }
  document.addEventListener('keydown', function (e) {
    var vn = $('vn'); if (!vn || !ex.mode) return;
    if (ex.mode === 'replay' && page !== 'explore') return;
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault(); if (!$('vn-log').hidden || !$('vn-end').hidden || !$('vn-pick').hidden) return; next();
    } else if (e.key === 'Escape' && !$('vn-log').hidden) $('vn-log').hidden = true;
  });

  renderTop(); syncBattle();
})();

</script>
