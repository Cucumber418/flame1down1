<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flame1Down - 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 手写字体来自 Google Fonts，国内经常连不上；用 media=print 技巧异步加载，连不上也不会卡住页面，会自动用楷体代替 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css?v=20261117-1">
<link rel="stylesheet" href="css/battle-layout.css?v=20261117-5">
<link rel="stylesheet" href="css/bag-layout.css?v=20261116-13">
<link rel="stylesheet" href="css/collection-layout.css?v=20261116-8">
<link rel="stylesheet" href="css/map-layout.css?v=20261118-1">
<link rel="stylesheet" href="css/planet-map.css?v=20261116-16">
<link rel="stylesheet" href="css/storage-layout.css?v=20261115-8">
<link rel="stylesheet" href="css/estate-view.css?v=20261116-1">
</head>
<body>

<div class="sheet">
  <header class="topbar">
    <div class="acct" id="who">
      <button type="button" class="who-btn" id="who-btn" aria-haspopup="true" aria-expanded="false"><span class="av" id="who-av">?</span><span><span class="lab" id="who-title">做题家</span><br><b id="who-name"></b></span></button>
      <button type="button" class="mail-btn" id="mail-btn" aria-label="邮箱" title="邮箱"><span aria-hidden="true">✉</span><b>邮箱</b><i class="q-badge" id="mail-badge" hidden></i></button>
      <div class="snd-wrap"><button type="button" class="mail-btn snd-btn" id="snd-btn" aria-haspopup="true" aria-expanded="false" title="设置"><span aria-hidden="true">⚙</span><b>设置</b></button><div class="snd-menu" id="snd-menu" hidden></div></div>
      <button type="button" class="mail-btn" id="wiki-btn" aria-label="Wiki：精灵和技能资料" title="Wiki：精灵和技能资料"><span aria-hidden="true">📚</span><b>Wiki</b></button>
      <button type="button" class="mail-btn" id="board-btn" aria-label="讨论区" title="讨论区"><span aria-hidden="true">💬</span><b>讨论</b><i class="q-badge dot-badge" id="board-badge" hidden></i></button>
      <span class="res" id="res" hidden></span>
      <div class="qtop-wrap" id="qtop-wrap"><button type="button" class="mail-btn qtop-btn" id="qtop-btn" aria-label="任务" aria-haspopup="dialog" title="任务"><span aria-hidden="true">📜</span><b>任务</b><i class="q-badge" id="qtop-badge" hidden></i></button><div class="qtop-pop" id="qtop-pop" hidden></div></div>
      <button type="button" class="mail-btn fullscreen-btn" id="fullscreen-btn" aria-label="全屏显示游戏" aria-pressed="false" title="全屏显示游戏"><span aria-hidden="true">⛶</span><b>全屏</b></button>
      <div class="who-menu" id="who-menu" hidden>
        <div class="gender-box" id="gender-box"></div>
        <div class="avatar-box" id="avatar-box"></div>
        <div class="title-box" id="title-box"></div>
        <div class="rename-box" id="rename-box"></div>
        <p id="who-info"></p>
      </div>
    </div>
    <nav class="mainnav" id="mainnav" role="tablist" aria-label="主菜单">
      <button type="button" class="nav" data-page="log" role="tab" aria-selected="false" aria-label="航行日志"><span class="nav-icon" aria-hidden="true">📒</span><span class="nav-label">航行日志</span><span class="nav-short" aria-hidden="true">日志</span></button>
      <button type="button" class="nav" data-page="bag" role="tab" aria-selected="false" aria-label="精灵一览"><span class="nav-icon" aria-hidden="true">🐾</span><span class="nav-label">精灵一览</span><span class="nav-short" aria-hidden="true">精灵</span></button>
      <button type="button" class="nav" data-page="ship" role="tab" aria-selected="false" aria-label="飞船终端"><span class="nav-icon" aria-hidden="true">🚀</span><span class="nav-label">飞船终端</span><span class="nav-short" aria-hidden="true">终端</span></button>
      <button type="button" class="nav" data-page="explore" role="tab" aria-selected="false" aria-label="星际探索"><span class="nav-icon" aria-hidden="true">🪐</span><span class="nav-label">星际探索</span><span class="nav-short" aria-hidden="true">探索</span></button>
      <button type="button" class="nav" data-page="items" role="tab" aria-selected="false" aria-label="储存箱"><span class="nav-icon" aria-hidden="true">📦</span><span class="nav-label">储存箱</span><span class="nav-short" aria-hidden="true">储存</span></button>
      <button type="button" class="nav" data-page="social" role="tab" aria-selected="false" aria-label="社交"><span class="nav-icon" aria-hidden="true">👥</span><span class="nav-label">社交</span><span class="nav-short" aria-hidden="true">社交</span></button>
    </nav>
  </header>
  <div class="onboard-wrap" id="onboard" hidden></div>

  <div class="page" id="pg-holo" hidden></div>

  <div class="page" id="pg-arena">
  <div class="crumb arena-crumb" id="arena-crumb"><button type="button" class="btn ghost" id="arena-back">‹ 返回飞船终端</button><b>飞船终端 · 竞技对战</b></div>

  <!-- ============ 选精灵 ============ -->
  <section id="builder">
    <div class="modebar" role="tablist" aria-label="模式">
      <button type="button" class="mode on" id="mode-sandbox" role="tab" aria-selected="true"><b>沙盒调试</b><span>自由组建阵容，可预先查看对手配置，用于测试技能与数值</span></button>
      <button type="button" class="mode" id="mode-rank" role="tab" aria-selected="false"><b>平衡排位</b><span>从系统给出的两套阵容中择一出战，对手阵容不公开，计入段位 · 每天前 10 局每局 1000 经验 + 20 竞技代币</span></button>
      <button type="button" class="mode" id="mode-brawl" role="tab" aria-selected="false"><b>精灵大乱斗</b><span id="brawl-sub">多人在线时开放 · 双方各出 3 只，打乱后随机分配</span></button>
    </div>
    <div class="rankcard" id="rankcard" hidden></div>
    <div class="brawl" id="brawl" hidden></div>
    <div class="subbar" id="subbar" role="tablist" aria-label="沙盒内容">
      <button type="button" class="sub on" id="sub-battle" role="tab" aria-selected="true">对战</button>
      <button type="button" class="sub" id="sub-train" role="tab" aria-selected="false">训练</button>
      <span class="hint" id="sub-hint">与随机配置的电脑对战</span>
    </div>
    <div class="bagbox">
      <span class="tape l"></span><span class="tape r"></span>
      <div class="bag-head">
        <h2 class="sec" id="bag-title">我的背包</h2>
        <p class="hint" id="bag-hint">排在第 1 位的精灵为首发。点击背包或图鉴中的精灵，可在右侧查看资料并选择 4 个技能。</p>
      </div>
      <div class="draft" id="draft" hidden></div>
      <div class="trainset" id="trainset" hidden>
        <div class="ts-mon" id="ts-mon"></div>
        <div class="ts-opts">
          <div class="ts-row"><label for="ts-lv">我方等级</label>
            <input type="range" id="ts-lvr" min="1" max="100" step="1" value="100" aria-label="我方等级滑块">
            <input type="number" id="ts-lv" min="1" max="100" step="1" value="100" inputmode="numeric"></div>
          <div class="ts-row"><span class="ts-lab">木桩双防</span>
            <div class="seg" role="radiogroup" aria-label="木桩双防种族值">
              <label><input type="radio" name="ts-def" id="ts-def0" value="0"><span>0</span></label>
              <label><input type="radio" name="ts-def" id="ts-def50" value="50" checked><span>50</span></label>
              <label><input type="radio" name="ts-def" id="ts-def100" value="100"><span>100</span></label>
            </div><span class="hint">物防、特防种族值</span></div>
          <p class="hint" id="ts-note"></p>
        </div>
      </div>
      <ol class="bag" id="bag"></ol>
      <div class="bag-actions">
        <p class="hint" id="bag-msg"></p>
        <button class="btn ghost" id="btn-random" type="button">随机背包</button>
        <button class="btn primary" id="btn-start" type="button">开始对战</button>
      </div>
    </div>
    <div class="build">
      <div>
        <h2 class="sec">精灵图鉴</h2>
        <div class="dex-grid" id="dex"></div>
        <details class="chartbox" id="chartbox"><summary>属性克制表（试验版）</summary><div id="chart"></div></details>
      </div>
      <article class="detail" id="detail"></article>
    </div>
  </section>

  <!-- ============ 对战 ============ -->
  <section id="battle" hidden>
    <div class="plates">
      <div class="plate" id="plate0"><span class="tape l"></span></div>
      <div class="vs"><span class="battle-round">第<b id="turnNo">1</b>回合</span><span class="tmax" id="turnMax">上限 60</span></div>
      <div class="plate r" id="plate1"><span class="tape r"></span></div>
    </div>
    <div class="field" id="field">
      <div class="mon p0" id="mon0"><div class="ground"></div><div class="face"><img alt=""></div></div>
      <div class="mon p1" id="mon1"><div class="ground"></div><div class="face"><img alt=""></div></div>
      <div class="banner" id="banner"></div>
      <div class="endcard" id="endcard" hidden>
        <div class="box">
          <h3 id="end-title">胜利</h3>
          <p class="hint" id="end-sub"></p>
          <p class="end-hid" id="end-hid" hidden></p>
          <div class="end-rank" id="end-rank" hidden></div>
          <div class="row">
            <button class="btn primary" id="btn-again" type="button">同样的背包再来一局</button>
            <button class="btn" id="btn-back" type="button">回到背包</button>
          </div>
        </div>
      </div>
    </div>
    <div class="statsbox" id="statsbox" hidden>
      <button type="button" class="tab battle-panel-close" data-battle-close="stats" aria-label="关闭伤害统计">关闭</button>
      <div class="sb-head"><h4>伤害统计</h4>
        <div class="sb-btns"><button type="button" class="btn ghost" id="btn-sreset">清空统计</button><button type="button" class="btn ghost" id="btn-dreset">重置木桩状态</button></div></div>
      <div class="sb-tiles" id="sb-tiles"></div>
      <div class="sb-table"><table><thead><tr><th>来源</th><th>命中次数</th><th>总伤害</th><th>平均</th><th>最高</th><th>占比</th></tr></thead><tbody id="sb-rows"></tbody></table></div>
    </div>
    <div class="console">
      <div class="cmd">
        <div class="tabs">
          <button class="tab on" id="tab-moves" type="button">技能</button>
          <button class="tab" id="tab-team" type="button">精灵</button>
          <button class="tab" id="tab-items" type="button" hidden>道具</button>
          <button type="button" class="tab" id="battle-log-toggle" aria-controls="battle-logbox" aria-expanded="false">记录</button>
          <button type="button" class="tab" id="battle-stats-toggle" aria-controls="statsbox" aria-expanded="false" hidden>统计</button>
          <button type="button" class="tab" data-fullscreen aria-label="全屏显示游戏" aria-pressed="false"><b>全屏</b></button>
          <button class="tab speed" id="btn-speed" type="button" aria-pressed="false">动画：正常</button>
          <span class="emote-wrap"><button class="tab emote" id="btn-emote" type="button" hidden>😀 表情</button><span class="emote-pop" id="emote-pop" hidden></span></span>
          <button class="tab invite" id="btn-invite" type="button" hidden>邀请全服观战</button>
          <button class="tab quit" id="btn-quit" type="button">认输</button>
        </div>
        <div class="mgrid" id="mgrid"></div>
        <div class="tgrid" id="tgrid" hidden></div>
        <div class="tgrid igrid" id="igrid" hidden></div>
        <p class="hint" id="cmd-hint"></p>
      </div>
      <div class="logbox" id="battle-logbox">
        <button type="button" class="tab battle-panel-close" data-battle-close="log" aria-label="关闭战斗记录">关闭</button>
        <h4>战斗记录 <span class="cast-wrap"><button type="button" class="cast-n" id="cast-n" hidden></button><span class="cast-pop" id="cast-pop" hidden></span></span></h4>
        <div class="battle-tools" id="battle-tools"></div>
        <div class="log" id="log" aria-live="polite"></div>
      </div>
    </div>
    <section class="battle-info-panel" id="battle-info-panel" role="dialog" aria-modal="true" aria-label="技能与状态说明" hidden>
      <button type="button" class="tab battle-panel-close" data-battle-close="info" aria-label="关闭技能与状态说明">关闭</button>
      <h3>技能与状态说明</h3>
      <div id="battle-info-list"></div>
    </section>
  </section>
  </div>

  <div class="page" id="pg-bag" hidden></div>
  <div class="page" id="pg-store" hidden></div>
  <div class="page" id="pg-release" hidden></div>
  <div class="page" id="pg-dex" hidden></div>
  <div class="page" id="pg-log" hidden></div>
  <div class="page" id="pg-items" hidden></div>
  <div class="page" id="pg-social" hidden></div>
  <div class="page" id="pg-explore" hidden></div>
</div>

<div class="display-status" id="display-status" role="status" aria-live="polite" hidden></div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="精灵大图">
  <div class="lb-box">
    <button type="button" class="lb-nav" id="lb-prev" aria-label="上一个形态">‹</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button type="button" class="lb-nav" id="lb-next" aria-label="下一个形态">›</button>
    <button type="button" class="lb-close" id="lb-close" aria-label="关闭">×</button>
  </div>
</div>

<!-- 脚本按顺序加载：数据 → 对战引擎 → 界面。顺序不能乱 -->
<!-- cloud.js 先加载：用服务器打开时先登录、取回存档，再按下面的顺序加载游戏脚本（数据 → 引擎 → 界面，顺序不能调换） -->
<script src="js/ui/viewport.js?v=20261116-12"></script>
<script src="js/ui/land.js?v=20261116-12"></script>
<script src="js/ui/skill-inspect.js?v=20261118-1"></script>
<script src="js/ui/loader.js"></script>
<script src="js/net/cloud.js?v=20261116-6"></script>
<script>
CLOUD.boot([
  'js/data/content-words.js',
  'js/engine/content.js',
  'js/data/assets.js',
  'js/data/types.js',
  'js/data/moves.js',
  'js/data/creatures.js',
  'js/data/story.js',
  'js/data/mail.js',
  'js/data/changelog.js?v=20261120-2',
  'js/data/monchanges.js',
  'js/data/wild.js',
  'js/data/chatter.js',
  'js/data/avfocus.js',
  'js/data/xcq.js',
  'js/data/ship-map.js',
  'js/engine/battle.js',
  'js/engine/ai.js',
  'js/engine/ranked.js',
  'js/engine/tx.js',
  'js/engine/pvp.js',
  'js/engine/acc.js',
  'js/engine/pve.js',
  'js/engine/grow.js',
  'js/engine/rewards.js',
  'js/engine/world.js',
  'js/engine/quest.js',
  'js/engine/story.js',
  'js/engine/award.js',
  'js/engine/summon.js',
  'js/engine/endless.js',
  'js/ui/audio.js?v=20261116-6',
  'js/ui/battle-ui.js?v=20261116-15',
  'js/ui/game.js?v=20261120-1',
  'js/ui/social.js?v=20261116-13',
  'js/ui/board.js',
  'js/ui/display.js',
  'js/ui/battle-layout.js?v=20261118-1',
  'js/ui/bag-layout.js?v=20261116-13',
  'js/ui/collection-layout.js?v=20261116-8',
  'js/ui/map-layout.js?v=20261116-13',
  'js/ui/estate-view.js?v=20261116-1'
]);
</script>
</body>
</html>
