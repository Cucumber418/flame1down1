# Windows 客户端：desktop/ 有改动推到 main 时，在 GitHub 的 Windows 机器上打包安装程序。
# 打好的安装包在这次运行页面最下面的 Artifacts 里下载（windows-client），再发到船员 QQ 群的群文件。
#
# DEPLOY_HOST（部署游戏用的 secret）会写进客户端，装好第一次打开就直接连这台服务器（端口自动试 8080 和 80）。
#
# 传到游戏服务器（玩家在「关于」里直接下载）默认不做：从 GitHub 往国内服务器传 100 MB 实测 90 分钟都传不完，
# 白白耗掉 Actions 的时长。真要试，在 Actions 页面手动运行这个流程，勾选「上传到游戏服务器」。
#
# 发新版客户端：改 desktop/package.json 里的 version，推上来就行。
# 已经装了旧版的玩家，打开客户端时会提示有新版（版本号由服务器从 desktop/package.json 读取）。
name: Windows 客户端

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-client.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: '上传到游戏服务器（很慢，可能要一个多小时）'
        type: boolean
        default: false

concurrency:
  group: windows-client
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 打包安装程序
        env:
          F1D_SERVER: ${{ secrets.DEPLOY_HOST }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: ubuntu-latest
    # 从 GitHub 往国内服务器传 100 MB 很慢（实测 15 分钟传不完），给足时间；
    # 中途断了也不要紧：没传完的部分留在服务器的 .partial 里，重新运行会接着传
    timeout-minutes: 90
    steps:
      - name: 检查是否已配置服务器
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice title=没有上传::还没有设置 DEPLOY_HOST / DEPLOY_KEY，安装包只保存在这次运行的 Artifacts 里。"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.ok == 'yes'
        with:
          name: windows-client
          path: out

      - name: 准备 SSH 钥匙
        if: steps.cfg.outputs.ok == 'yes'
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          HOST=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1; then
            BODY=$(printf '%s' "$KEY" | tr -d '\r\n' | sed -E 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' ')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/deploy
          fi

      - name: 上传到服务器
        if: steps.cfg.outputs.ok == 'yes'
        run: |
          cd out
          FILE=$(ls -1 *.exe | head -n 1)
          VER=$(printf '%s' "$FILE" | sed -E 's/^Flame1Down-Setup-(.*)\.exe$/\1/')
          SIZE=$(stat -c %s "$FILE")
          printf '{"version":"%s","file":"%s","size":%s,"date":"%s"}\n' "$VER" "$FILE" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > client.json
          cat client.json
          SSH="ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ConnectTimeout=30"
          $SSH "ubuntu@$HOST" 'sudo mkdir -p /opt/flame1down-data/client'
          for i in 1 2 3 4 5; do
            rsync -a --partial-dir=.partial --timeout=120 -e "$SSH" --rsync-path="sudo rsync" "$FILE" "ubuntu@$HOST:/opt/flame1down-data/client/" && break
            echo "第 $i 次上传失败，10 秒后重试"; sleep 10
            [ "$i" = 5 ] && { echo "::error title=上传失败::安装包传到服务器失败了五次。重新运行这个流程会接着传。"; exit 1; }
          done
          # 安装包传完再换版本信息，玩家不会下到传了一半的文件；只留最新的两个安装包
          rsync -a -e "$SSH" --rsync-path="sudo rsync" client.json "ubuntu@$HOST:/opt/flame1down-data/client/"
          $SSH "ubuntu@$HOST" 'cd /opt/flame1down-data/client && ls -1t Flame1Down-Setup-*.exe 2>/dev/null | tail -n +3 | xargs -r sudo rm -f; ls -l'
          echo "::notice title=客户端已上传::v$VER 已经可以在游戏「关于」里下载了。"
