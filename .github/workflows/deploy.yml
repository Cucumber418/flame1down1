# 自动部署：每次有代码推到 main，GitHub 就把新版本送到腾讯云服务器并重启游戏服务。
# 需要在仓库 Settings → Secrets and variables → Actions 里设置两个 secret：
#   DEPLOY_HOST  服务器公网 IP
#   DEPLOY_KEY   服务器上生成的部署私钥（server/setup-deploy.sh 会打印出来）
# 没设置 secret 时这个流程会直接跳过，不会报错。
name: 部署到服务器

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检查是否已配置服务器
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "还没有设置 DEPLOY_HOST / DEPLOY_KEY，跳过部署。"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 记下这台部署机器的公网 IP（腾讯云会把它报成「异地登录」，方便核对）
        if: steps.cfg.outputs.ok == 'yes'
        run: |
          IP=$(curl -fsS --max-time 10 https://api.ipify.org || curl -fsS --max-time 10 https://ifconfig.me || echo 未知)
          echo "::notice title=部署机器 IP::这次部署从 $IP 登录服务器（$(date -u -d '+8 hours' '+%H:%M:%S') 北京时间）。腾讯云「可疑登录」告警里的来源 IP 和这个一致，就是自动部署。"

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ok == 'yes'

      - name: 准备 SSH 钥匙并检查能不能连上服务器
        if: steps.cfg.outputs.ok == 'yes'
        env:
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # 容错：去掉 http://、端口、路径和空白，只留下 IP
          HOST=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1; then
            # 从网页终端复制时换行可能变成了空格：按标准格式重新排一遍
            BODY=$(printf '%s' "$KEY" | tr -d '\r\n' | sed -E 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' ')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/deploy
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy >/dev/null 2>&1; then
            echo "::error title=DEPLOY_KEY 不对::DEPLOY_KEY 不是完整的私钥。要从 -----BEGIN OPENSSH PRIVATE KEY----- 一直复制到 -----END OPENSSH PRIVATE KEY-----，包括这两行。"
            exit 1
          fi
          if ! timeout 20 bash -c "exec 3<>/dev/tcp/$HOST/22" 2>/dev/null; then
            echo "::error title=连不上服务器::从 GitHub 连不上服务器的 22 端口。请检查：1) DEPLOY_HOST 是不是服务器的公网 IP；2) 腾讯云控制台 → 这台服务器 → 防火墙 里是否放行了 TCP 22。"
            exit 1
          fi
          if ! ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o BatchMode=yes "ubuntu@$HOST" true 2>/tmp/ssh.err; then
            echo "::error title=服务器拒绝了这把钥匙::能连上服务器，但登录失败。请确认在服务器上用 ubuntu 账号（不加 sudo）运行过生成钥匙的那行命令。详情：$(tr '\n' ' ' </tmp/ssh.err)"
            exit 1
          fi
          echo "已连上服务器"

      - name: 上传新版本
        if: steps.cfg.outputs.ok == 'yes'
        run: |
          for i in 1 2 3; do
            rsync -az --delete --exclude '.git' --exclude '.github' \
              -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ConnectTimeout=30" \
              --rsync-path="sudo rsync" ./ "ubuntu@$HOST:/opt/flame1down1/" && break
            echo "第 $i 次上传失败，10 秒后重试"; sleep 10
            [ "$i" = 3 ] && { echo "::error title=上传失败::上传新版本到服务器失败了三次，请把这个页面截图发给 Claude。"; exit 1; }
          done

      - name: 重启游戏服务并自检
        if: steps.cfg.outputs.ok == 'yes'
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "ubuntu@$HOST" 'sudo systemctl restart flame1down && sleep 2 && P=$(sed -n "s/^Environment=PORT=//p" /etc/systemd/system/flame1down.service); curl -fsS "http://127.0.0.1:${P:-80}/ping" && echo " 服务器已更新到 '"${GITHUB_SHA::7}"'"'
